<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yumbuni ECD — Letters &amp; Numbers</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E8B57">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face{
    font-family:'Fredoka';
    src: url('font-fredoka.ttf') format('truetype-variations'), url('font-fredoka.ttf') format('truetype');
    font-weight: 300 700;
    font-display: swap;
  }
  @font-face{
    font-family:'Baloo 2';
    src: url('font-baloo2.ttf') format('truetype-variations'), url('font-baloo2.ttf') format('truetype');
    font-weight: 400 800;
    font-display: swap;
  }
</style>
<style>
  :root{
    --yellow:#FFC72C;
    --yellow-deep:#E0A800;
    --green:#2E8B57;
    --green-deep:#1B5E3A;
    --alert:#D64545;
    --alert-deep:#B23333;
    --cream:#FFFDF5;
    --ink:#231F1B;
    --ink-soft:#6b6457;
    --white:#ffffff;
    --shadow: rgba(35,31,27,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: linear-gradient(180deg, #EAF7EE 0%, var(--cream) 55%);
    font-family:'Fredoka', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 16px 28px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .brand{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:22px;
    color:var(--green-deep);
    display:flex; align-items:center; gap:8px;
  }
  .brand .fox{ font-size:28px; }
  .score-pill{
    background:var(--white);
    border-radius:999px;
    padding:8px 16px;
    font-weight:600;
    font-size:15px;
    box-shadow:0 3px 0 var(--shadow);
    display:flex; align-items:center; gap:6px;
  }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Home / mode select ---------- */
  #home{ justify-content:center; align-items:center; text-align:center; gap:22px; }
  #home h1{
    font-family:'Baloo 2', sans-serif;
    font-size:30px;
    font-weight:800;
    margin:0;
    color:var(--ink);
  }
  #home p.sub{
    margin:0; color:var(--ink-soft); font-size:16px; max-width:320px;
  }
  .mode-list{
    display:flex; flex-direction:column; gap:14px; width:100%;
  }
  .mode-card{
    border:none; cursor:pointer;
    border-radius:22px;
    padding:18px 20px;
    display:flex; align-items:center; gap:14px;
    font-family:'Fredoka', sans-serif;
    text-align:left;
    box-shadow:0 5px 0 var(--shadow);
    transition:transform .08s ease;
  }
  .mode-card:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--shadow); }
  .mode-card .emoji{ font-size:30px; }
  .mode-card .txt strong{ display:block; font-size:18px; font-weight:700; }
  .mode-card .txt span{ font-size:13px; color:var(--ink-soft); }
  #mode-easy{ background:#FFF6D9; border:3px solid var(--yellow); }
  #mode-medium{ background:#E3F3E8; border:3px solid var(--green); }
  #mode-hard{ background:#F0EFEA; border:3px solid var(--ink); }

  /* ---------- Game screen ---------- */
  #game{ gap:18px; }
  .game-top{
    display:flex; justify-content:space-between; align-items:center;
  }
  .back-btn{
    border:none; background:var(--white); border-radius:999px;
    width:38px; height:38px; font-size:18px; cursor:pointer;
    box-shadow:0 3px 0 var(--shadow);
  }
  .streak-pill{
    background:var(--white); border-radius:999px; padding:7px 14px;
    font-size:14px; font-weight:600; box-shadow:0 3px 0 var(--shadow);
  }

  .prompt-card{
    background:var(--white);
    border-radius:28px;
    padding:34px 20px;
    text-align:center;
    box-shadow:0 6px 0 var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:14px;
  }
  .prompt-label{
    font-size:14px; color:var(--ink-soft); font-weight:600;
  }
  .prompt-value{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:56px;
    color:var(--green-deep);
    line-height:1;
  }
  .speak-btn{
    border:none; background:var(--yellow); color:var(--ink);
    font-family:'Fredoka'; font-weight:600; font-size:15px;
    padding:10px 20px; border-radius:999px; cursor:pointer;
    box-shadow:0 4px 0 var(--yellow-deep);
    display:flex; align-items:center; gap:8px;
  }
  .speak-btn:active{ transform:translateY(3px); box-shadow:none; }

  /* ---------- Counting visuals (medium mode) ---------- */
  .counters-row{
    display:flex; align-items:center; justify-content:center; gap:12px;
    width:100%;
  }
  .counter-group{
    display:flex; flex-wrap:wrap; gap:5px; justify-content:center;
    max-width:130px;
  }
  .counter-op{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:22px;
    color:var(--ink-soft); flex-shrink:0;
  }
  .ball{
    width:18px; height:18px; border-radius:50%;
    background:var(--yellow-deep);
    box-shadow:inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  .ball.b-group{ background:var(--green); }
  .ball.removed{
    background:transparent;
    border:2px dashed #C8C1AF;
    opacity:0.6;
  }
  .stick{
    width:6px; height:22px; border-radius:3px;
    background:var(--yellow-deep);
  }
  .stick.b-group{ background:var(--green); }
  .stick.removed{
    background:transparent;
    border:2px dashed #C8C1AF;
    opacity:0.6;
    width:2px;
  }

  .choices{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .choice-btn{
    border:none; border-radius:20px; background:var(--white);
    font-family:'Baloo 2'; font-weight:700; font-size:26px;
    padding:22px 10px; cursor:pointer; color:var(--ink);
    box-shadow:0 5px 0 var(--shadow);
    transition:transform .08s ease, background .15s ease;
  }
  .choice-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--shadow); }
  .choice-btn.correct{ background:var(--green); color:white; box-shadow:0 5px 0 var(--green-deep); }
  .choice-btn.wrong{ background:var(--alert); color:white; box-shadow:0 5px 0 var(--alert-deep); }
  .choice-btn[disabled]{ opacity:0.55; }

  /* Hard mode input */
  .answer-row{
    display:flex; gap:10px;
  }
  .answer-input{
    flex:1;
    font-family:'Baloo 2'; font-size:26px; font-weight:700; text-align:center;
    border:3px solid #E3DDCB; border-radius:16px; padding:14px;
    background:var(--white); color:var(--ink);
  }
  .answer-input:focus{ outline:none; border-color:var(--yellow-deep); }
  .submit-btn{
    border:none; border-radius:16px; background:var(--green); color:white;
    font-family:'Fredoka'; font-weight:600; font-size:18px;
    padding:0 24px; cursor:pointer;
    box-shadow:0 4px 0 var(--green-deep);
  }
  .submit-btn:active{ transform:translateY(3px); box-shadow:none; }

  .feedback{
    text-align:center; font-weight:600; font-size:16px; min-height:22px;
  }
  .feedback.good{ color:#2F8F45; }
  .feedback.bad{ color:#D64B3B; }

  .next-btn{
    border:none; background:var(--green-deep); color:white;
    font-family:'Fredoka'; font-weight:600; font-size:16px;
    padding:14px; border-radius:16px; cursor:pointer;
    box-shadow:0 4px 0 #12432A;
  }
  .next-btn:active{ transform:translateY(3px); box-shadow:none; }
  .hidden{ display:none !important; }

  footer.tip{
    text-align:center; color:var(--ink-soft); font-size:12px; margin-top:auto; padding-top:18px;
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><span class="fox">🎒</span> Yumbuni ECD</div>
    <div class="score-pill">⭐ <span id="score-display">0</span></div>
  </div>

  <!-- HOME SCREEN -->
  <div id="home" class="screen active">
    <h1>Ready to play?</h1>
    <p class="sub">Pick a mode, Fox will read it out loud, and you find the right answer!</p>
    <div class="mode-list">
      <button class="mode-card" id="mode-easy" onclick="startGame('easy')">
        <span class="emoji">🔤</span>
        <span class="txt"><strong>Easy</strong><span>Letters, numbers &amp; shapes, 4 choices</span></span>
      </button>
      <button class="mode-card" id="mode-medium" onclick="startGame('medium')">
        <span class="emoji">➕</span>
        <span class="txt"><strong>Medium</strong><span>Simple math, 4 choices</span></span>
      </button>
      <button class="mode-card" id="mode-hard" onclick="startGame('hard')">
        <span class="emoji">🧠</span>
        <span class="txt"><strong>Hard</strong><span>Simple math, type the answer</span></span>
      </button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game" class="screen">
    <div class="game-top">
      <button class="back-btn" onclick="goHome()">←</button>
      <button class="streak-pill hidden" id="counter-style-btn" onclick="toggleCounterStyle()" style="border:none;cursor:pointer;">🔵 Balls</button>
      <div class="streak-pill">🔥 Streak: <span id="streak-display">0</span></div>
    </div>

    <div class="prompt-card">
      <div class="prompt-label" id="prompt-label">Listen and choose</div>
      <div class="prompt-value" id="prompt-value">A</div>
      <div class="counters-row hidden" id="counters-row"></div>
      <button class="speak-btn" onclick="speakPrompt()">🔊 Hear it again</button>
    </div>

    <div id="choices-wrap" class="choices"></div>

    <div id="input-wrap" class="answer-row hidden">
      <input class="answer-input" id="answer-input" type="number" inputmode="numeric" placeholder="?">
      <button class="submit-btn" onclick="submitTyped()">Check</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <button class="next-btn hidden" id="next-btn" onclick="nextRound()">Next ▶</button>
  </div>

  <footer class="tip">Tip: turn your sound on so Fox can talk! 🔊</footer>
</div>

<script>
let mode = 'easy';
let score = 0;
let streak = 0;
let current = null; // {label, value, answer, choices}
let answered = false;

const promptLabelEl = document.getElementById('prompt-label');
const promptValueEl = document.getElementById('prompt-value');
const choicesWrap = document.getElementById('choices-wrap');
const inputWrap = document.getElementById('input-wrap');
const answerInput = document.getElementById('answer-input');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('next-btn');
const scoreDisplay = document.getElementById('score-display');
const streakDisplay = document.getElementById('streak-display');
const countersRow = document.getElementById('counters-row');
const counterStyleBtn = document.getElementById('counter-style-btn');

let counterStyle = 'ball'; // 'ball' or 'stick'

function toggleCounterStyle(){
  counterStyle = counterStyle === 'ball' ? 'stick' : 'ball';
  counterStyleBtn.textContent = counterStyle === 'ball' ? '🔵 Balls' : '📏 Sticks';
  if(current && current.counters) renderCounters(current.counters);
}

function renderCounters(c){
  countersRow.innerHTML = '';
  countersRow.classList.remove('hidden');

  const shapeClass = counterStyle === 'ball' ? 'ball' : 'stick';

  const groupA = document.createElement('div');
  groupA.className = 'counter-group';
  for(let i = 0; i < c.x; i++){
    const el = document.createElement('div');
    el.className = shapeClass;
    groupA.appendChild(el);
  }

  const opEl = document.createElement('div');
  opEl.className = 'counter-op';
  opEl.textContent = c.useAdd ? '+' : '−';

  const groupB = document.createElement('div');
  groupB.className = 'counter-group';
  for(let i = 0; i < c.y; i++){
    const el = document.createElement('div');
    // for subtraction, show the "b" group as items being removed from a matching set
    el.className = shapeClass + ' ' + (c.useAdd ? 'b-group' : 'removed');
    groupB.appendChild(el);
  }

  countersRow.appendChild(groupA);
  countersRow.appendChild(opEl);
  countersRow.appendChild(groupB);
}

function goHome(){
  document.getElementById('home').classList.add('active');
  document.getElementById('game').classList.remove('active');
}

function startGame(m){
  mode = m;
  document.getElementById('home').classList.remove('active');
  document.getElementById('game').classList.add('active');
  nextRound();
}

let currentAudio = null;

function playQueue(tokens){
  if(!tokens || !tokens.length) return;
  if(currentAudio){
    currentAudio.onended = null;
    currentAudio.pause();
  }
  const audio = new Audio();
  currentAudio = audio;
  let i = 0;
  function step(){
    if(i >= tokens.length) return;
    audio.src = 'audio-' + tokens[i] + '.mp3';
    audio.play().catch(() => {});
    i++;
  }
  audio.onended = step;
  step();
}

function speakPrompt(){
  if(!current) return;
  playQueue(current.audioPrompt);
}

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const SHAPES = [
  { name: "circle",    emoji: "🔴" },
  { name: "square",    emoji: "🟦" },
  { name: "triangle",  emoji: "🔺" },
  { name: "star",      emoji: "⭐" },
  { name: "heart",     emoji: "💚" },
  { name: "diamond",   emoji: "🔶" }
];

function buildEasyRound(){
  const roll = Math.random();
  if(roll < 1/3){
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    const answer = letters[randInt(0, letters.length - 1)];
    let pool = shuffle(letters.filter(l => l !== answer)).slice(0, 3);
    const choices = shuffle([answer, ...pool]);
    return {
      label: "Which letter is this?",
      display: "🔊",
      audioPrompt: ["phrase_find_letter", "letter_" + answer.toLowerCase()],
      answerAudio: ["letter_" + answer.toLowerCase()],
      answer: answer,
      choices: choices,
      counters: null
    };
  } else if(roll < 2/3){
    const answer = randInt(0, 20);
    let pool = new Set();
    while(pool.size < 3){
      let n = randInt(Math.max(0, answer - 5), answer + 5);
      if(n !== answer && n >= 0) pool.add(n);
    }
    const choices = shuffle([answer, ...Array.from(pool)]);
    return {
      label: "Which number is this?",
      display: "🔊",
      audioPrompt: ["phrase_find_number", "num_" + answer],
      answerAudio: ["num_" + answer],
      answer: String(answer),
      choices: choices.map(String),
      counters: null
    };
  } else {
    const idx = randInt(0, SHAPES.length - 1);
    const correctShape = SHAPES[idx];
    let poolIdx = shuffle(SHAPES.map((s,i) => i).filter(i => i !== idx)).slice(0, 3);
    const choiceShapes = shuffle([correctShape, ...poolIdx.map(i => SHAPES[i])]);
    return {
      label: "Which shape is this?",
      display: "🔊",
      audioPrompt: ["phrase_find_shape", "shape_" + correctShape.name],
      answerAudio: ["shape_" + correctShape.name],
      answer: correctShape.emoji,
      choices: choiceShapes.map(s => s.emoji),
      counters: null
    };
  }
}

function buildMediumRound(){
  const useAdd = Math.random() < 0.5;
  const a = randInt(1, 12);
  const b = randInt(1, 12);
  const answer = useAdd ? a + b : (a >= b ? a - b : b - a);
  const x = useAdd ? a : Math.max(a,b);
  const y = useAdd ? b : Math.min(a,b);
  const spokenOp = useAdd ? "plus" : "minus";
  let pool = new Set();
  while(pool.size < 3){
    let n = answer + randInt(-4, 4);
    if(n !== answer && n >= 0) pool.add(n);
  }
  const choices = shuffle([answer, ...Array.from(pool)]);
  return {
    label: "Solve it!",
    display: `${x} ${useAdd ? '+' : '−'} ${y}`,
    audioPrompt: ["num_" + x, "op_" + (useAdd ? "plus" : "minus"), "num_" + y],
    answerAudio: ["num_" + answer],
    answer: String(answer),
    choices: choices.map(String),
    counters: { x, y, useAdd }
  };
}

function buildHardRound(){
  const ops = ['+', '−', '×'];
  const op = ops[randInt(0, ops.length - 1)];
  let a, b, answer, opToken;
  if(op === '+'){
    a = randInt(1, 20); b = randInt(1, 20); answer = a + b; opToken = "plus";
  } else if(op === '−'){
    a = randInt(5, 20); b = randInt(1, a); answer = a - b; opToken = "minus";
  } else {
    a = randInt(1, 10); b = randInt(1, 10); answer = a * b; opToken = "times";
  }
  return {
    label: "Type the answer",
    display: `${a} ${op} ${b}`,
    audioPrompt: ["num_" + a, "op_" + opToken, "num_" + b],
    answerAudio: ["num_" + answer],
    answer: String(answer),
    choices: null,
    counters: null
  };
}

function nextRound(){
  answered = false;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextBtn.classList.add('hidden');
  answerInput.value = '';

  if(mode === 'easy') current = buildEasyRound();
  else if(mode === 'medium') current = buildMediumRound();
  else current = buildHardRound();

  promptLabelEl.textContent = current.label;
  promptValueEl.textContent = current.display;

  if(current.counters){
    renderCounters(current.counters);
    counterStyleBtn.classList.remove('hidden');
  } else {
    countersRow.classList.add('hidden');
    countersRow.innerHTML = '';
    counterStyleBtn.classList.add('hidden');
  }

  if(mode === 'hard'){
    choicesWrap.classList.add('hidden');
    inputWrap.classList.remove('hidden');
    setTimeout(() => answerInput.focus(), 150);
  } else {
    inputWrap.classList.add('hidden');
    choicesWrap.classList.remove('hidden');
    renderChoices();
  }

  playQueue(current.audioPrompt);
}

function renderChoices(){
  choicesWrap.innerHTML = '';
  current.choices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = choice;
    btn.onclick = () => selectChoice(choice, btn);
    choicesWrap.appendChild(btn);
  });
}

function selectChoice(choice, btn){
  if(answered) return;
  answered = true;
  const correct = String(choice) === String(current.answer);
  Array.from(choicesWrap.children).forEach(b => {
    b.disabled = true;
    if(String(b.textContent) === String(current.answer)) b.classList.add('correct');
  });
  if(!correct) btn.classList.add('wrong');
  handleResult(correct);
}

function submitTyped(){
  if(answered) return;
  const val = answerInput.value.trim();
  if(val === '') return;
  answered = true;
  const correct = val === current.answer;
  handleResult(correct);
}

function handleResult(correct){
  if(correct){
    score += mode === 'hard' ? 3 : (mode === 'medium' ? 2 : 1);
    streak += 1;
    feedbackEl.textContent = "Great job! 🎉";
    feedbackEl.className = 'feedback good';
    playQueue(["phrase_great_job"]);
  } else {
    streak = 0;
    feedbackEl.textContent = `Not quite — it was ${current.answer}`;
    feedbackEl.className = 'feedback bad';
    playQueue(["phrase_nice_try", ...current.answerAudio]);
  }
  scoreDisplay.textContent = score;
  streakDisplay.textContent = streak;
  nextBtn.classList.remove('hidden');
}

answerInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter') submitTyped();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
